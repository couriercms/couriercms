name: Bug report
description: Report reproducible CourierCMS behavior that differs from its documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include minimal steps and sanitized configuration.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Elixir/OTP, PostgreSQL, runtime role, and relevant extension versions.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized evidence
      description: Never include credentials, webhook secrets, raw content, or complete payloads.
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not disclose a vulnerability or sensitive data.
          required: true
